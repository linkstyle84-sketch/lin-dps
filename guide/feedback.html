<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>피드백 게시판 · 도건유튜브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 36px 0 56px;
    }
    .back { margin: 0 0 18px; }
    .back a, .text-btn {
      color: var(--gold);
      font-weight: 800;
      text-decoration: none;
    }
    .back a:hover, .text-btn:hover { text-decoration: underline; }
    h1 { margin: 0 0 10px; font-size: 28px; font-weight: 900; letter-spacing: -0.03em; }
    .note { margin: 0 0 18px; color: var(--muted); font-size: 14px; font-weight: 700; line-height: 1.6; }
    .bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
    }
    .count { margin: 0; color: var(--muted); font-size: 14px; font-weight: 800; }
    .btn, button.btn {
      display: inline-block;
      border: 2px solid var(--gold);
      border-radius: 16px;
      padding: 12px 16px;
      background: rgba(228, 195, 106, 0.1);
      color: var(--gold);
      font: inherit;
      font-size: 16px;
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }
    button.btn:disabled { opacity: 0.6; cursor: default; }
    .scroll {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(228, 195, 106, 0.06);
    }
    table { width: 100%; border-collapse: collapse; font-size: 15px; font-weight: 800; }
    th, td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      white-space: nowrap;
    }
    tr:last-child td { border-bottom: 0; }
    th { color: var(--gold); font-weight: 900; background: rgba(12, 10, 8, 0.45); }
    td.num, th.num { width: 64px; text-align: right; color: var(--muted); }
    td.who, th.who { width: 110px; }
    td.when, th.when { width: 150px; color: var(--muted); }
    a.subject { color: var(--ink); font-weight: 800; text-decoration: none; }
    a.subject:hover { color: var(--gold); }
    .empty { color: var(--muted); font-weight: 700; }
    .card {
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(228, 195, 106, 0.06);
    }
    .card h2 { margin: 12px 0 8px; font-size: 22px; font-weight: 900; letter-spacing: -0.03em; }
    .meta { margin: 0; color: var(--muted); font-size: 14px; font-weight: 800; }
    .body {
      margin: 16px 0 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.75;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    form { display: grid; gap: 12px; }
    label { display: grid; gap: 6px; color: var(--gold); font-size: 14px; font-weight: 800; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      background: #140f0c;
      color: var(--ink);
      font: inherit;
      font-weight: 700;
    }
    textarea { min-height: 180px; resize: vertical; }
    .actions { display: flex; gap: 10px; align-items: center; }
    .status { margin: 14px 0 0; min-height: 1.5em; color: var(--gold); font-weight: 800; line-height: 1.5; }
    .hp { position: absolute; left: -9999px; }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="back"><a href="./">처음으로</a></p>
    <h1>피드백 게시판</h1>
    <p class="note">제목을 누르면 내용을 볼 수 있습니다. 올라온 글은 이 페이지에 공개됩니다.</p>
    <div id="app"></div>
    <p class="status" id="status" role="status"></p>
  </div>
  <script>
    var TOKEN = 'c6b74c20ad987368c700df8919c6d63d58c74baab7914983898341e6f4aa';
    var PATH = '린클-피드백-10-30';
    var app = document.getElementById('app');
    var status = document.getElementById('status');

    function el(tag, className, text) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function textOf(node) {
      if (node == null) return '';
      if (typeof node === 'string') return node;
      if (Array.isArray(node)) return node.map(textOf).join('');
      if (node.children) return textOf(node.children);
      return '';
    }

    function route() {
      var hash = decodeURIComponent(location.hash || '').replace(/^#/, '');
      if (hash === 'write') return { view: 'write' };
      if (hash.indexOf('post/') === 0) return { view: 'post', id: hash.slice(5) };
      return { view: 'list' };
    }

    function when(iso) {
      var date = new Date(iso);
      if (isNaN(date.getTime())) return '';
      return new Intl.DateTimeFormat('ko-KR', {
        timeZone: 'Asia/Seoul',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).format(date);
    }

    function loadPosts() {
      return fetch('https://api.telegra.ph/getPage/' + encodeURIComponent(PATH) + '?return_content=true')
        .then(function (res) { return res.json(); })
        .then(function (body) {
          if (!body || !body.ok) throw new Error('load');
          var raw = textOf(body.result && body.result.content);
          var data = JSON.parse(raw);
          if (!data || !Array.isArray(data.posts)) throw new Error('load');
          return data.posts.filter(function (post) {
            return post && typeof post.id === 'string' && typeof post.title === 'string' && typeof post.body === 'string';
          });
        });
    }

    function writePosts(posts) {
      var content = JSON.stringify([{ tag: 'pre', children: [JSON.stringify({ posts: posts })] }]);
      var body = new URLSearchParams();
      body.set('access_token', TOKEN);
      body.set('title', '린클 피드백');
      body.set('content', content);
      return fetch('https://api.telegra.ph/editPage/' + encodeURIComponent(PATH), {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: body
      }).then(function (res) { return res.json(); }).then(function (result) {
        if (!result || !result.ok) throw new Error('save');
      });
    }

    function newestFirst(posts) {
      return posts.slice().sort(function (a, b) {
        return String(b.at || '').localeCompare(String(a.at || ''));
      });
    }

    function showList(posts) {
      var ordered = newestFirst(posts);
      var bar = el('div', 'bar');
      bar.appendChild(el('p', 'count', '글 ' + ordered.length));
      var write = el('a', 'btn', '글쓰기');
      write.href = '#write';
      bar.appendChild(write);
      var scroll = el('div', 'scroll');
      var table = el('table');
      var head = document.createElement('thead');
      var hr = document.createElement('tr');
      hr.appendChild(el('th', 'num', '번호'));
      hr.appendChild(el('th', '', '제목'));
      hr.appendChild(el('th', 'who', '글쓴이'));
      hr.appendChild(el('th', 'when', '날짜'));
      head.appendChild(hr);
      table.appendChild(head);
      var body = document.createElement('tbody');
      if (!ordered.length) {
        var empty = document.createElement('tr');
        var cell = el('td', 'empty', '아직 올라온 글이 없습니다.');
        cell.colSpan = 4;
        empty.appendChild(cell);
        body.appendChild(empty);
      } else {
        ordered.forEach(function (post, index) {
          var row = document.createElement('tr');
          row.appendChild(el('td', 'num', String(ordered.length - index)));
          var titleCell = el('td');
          var link = el('a', 'subject', post.title);
          link.href = '#post/' + encodeURIComponent(post.id);
          titleCell.appendChild(link);
          row.appendChild(titleCell);
          row.appendChild(el('td', 'who', post.name || '익명'));
          row.appendChild(el('td', 'when', when(post.at)));
          body.appendChild(row);
        });
      }
      table.appendChild(body);
      scroll.appendChild(table);
      app.appendChild(bar);
      app.appendChild(scroll);
    }

    function showPost(posts, id) {
      var post = null;
      for (var i = 0; i < posts.length; i += 1) {
        if (posts[i].id === id) post = posts[i];
      }
      var card = el('div', 'card');
      var back = el('a', 'text-btn', '목록으로');
      back.href = '#';
      card.appendChild(back);
      if (!post) {
        card.appendChild(el('h2', '', '글을 찾지 못했습니다.'));
        app.appendChild(card);
        return;
      }
      card.appendChild(el('h2', '', post.title));
      card.appendChild(el('p', 'meta', (post.name || '익명') + ' · ' + when(post.at)));
      card.appendChild(el('p', 'body', post.body));
      app.appendChild(card);
    }

    function showWrite() {
      var card = el('div', 'card');
      var back = el('a', 'text-btn', '목록으로');
      back.href = '#';
      var form = document.createElement('form');
      form.appendChild(field('이름', 'name', 'input', '익명', 30));
      form.appendChild(field('제목', 'title', 'input', '제목을 적어 주세요.', 80));
      form.appendChild(field('내용', 'body', 'textarea', '고칠 점이나 추가하면 좋은 것을 적어 주세요.', 2000));
      var honey = document.createElement('input');
      honey.className = 'hp';
      honey.name = 'honey';
      honey.tabIndex = -1;
      honey.autocomplete = 'off';
      form.appendChild(honey);
      var actions = el('div', 'actions');
      var submit = el('button', 'btn', '올리기');
      submit.type = 'submit';
      actions.appendChild(submit);
      form.appendChild(actions);
      form.addEventListener('submit', function (event) {
        event.preventDefault();
        if (String(new FormData(form).get('honey') || '').trim()) return;
        var title = form.elements.title.value.trim();
        var body = form.elements.body.value.trim();
        var name = form.elements.name.value.trim() || '익명';
        if (!title) {
          status.textContent = '제목을 적어 주세요.';
          return;
        }
        if (body.length < 2) {
          status.textContent = '내용을 두 글자 이상 적어 주세요.';
          return;
        }
        submit.disabled = true;
        status.textContent = '올리는 중입니다.';
        var post = {
          id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8),
          title: title.slice(0, 80),
          body: body.slice(0, 2000),
          name: name.slice(0, 30),
          at: new Date().toISOString()
        };
        loadPosts().then(function (posts) {
          posts.push(post);
          posts.sort(function (a, b) { return String(a.at || '').localeCompare(String(b.at || '')); });
          if (posts.length > 100) posts = posts.slice(posts.length - 100);
          return writePosts(posts);
        }).then(function () {
          status.textContent = '올렸습니다.';
          location.hash = 'post/' + encodeURIComponent(post.id);
        }).catch(function () {
          status.textContent = '올리지 못했습니다. 잠시 뒤에 다시 눌러 주세요.';
          submit.disabled = false;
        });
      });
      card.appendChild(back);
      card.appendChild(form);
      app.appendChild(card);
    }

    function field(labelText, name, kind, placeholder, max) {
      var label = el('label', '', labelText);
      var input = document.createElement(kind === 'textarea' ? 'textarea' : 'input');
      input.name = name;
      input.maxLength = max;
      input.placeholder = placeholder;
      if (kind !== 'textarea') input.type = 'text';
      if (name === 'title' || name === 'body') input.required = true;
      label.appendChild(input);
      return label;
    }

    function draw() {
      var here = route();
      app.textContent = '';
      if (here.view !== 'write') status.textContent = '';
      loadPosts().then(function (posts) {
        if (route().view !== here.view || route().id !== here.id) return;
        app.textContent = '';
        if (here.view === 'write') showWrite();
        else if (here.view === 'post') showPost(posts, here.id);
        else showList(posts);
      }).catch(function () {
        app.textContent = '';
        app.appendChild(el('p', 'note', '게시판을 불러오지 못했습니다. 잠시 뒤에 다시 열어 주세요.'));
      });
    }

    window.addEventListener('hashchange', draw);
    draw();
  </script>
</body>
</html>
