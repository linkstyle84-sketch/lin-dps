<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리니지 클래식 · 도건유튜브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }
    header { text-align: center; margin-bottom: 28px; }
    h1 {
      margin: 0;
      font-size: clamp(26px, 5vw, 36px);
      font-weight: 900;
      color: var(--gold);
      letter-spacing: -0.03em;
    }
    .lead {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
    }
    .tools { display: grid; gap: 12px; }
    .tool {
      display: block;
      padding: 22px 22px;
      border-radius: 16px;
      border: 2px solid #ffe08a;
      background: linear-gradient(180deg, #f3d56a 0%, #d4a93a 100%);
      color: #1a1208;
      text-align: center;
      text-decoration: none;
      font-size: 20px;
      font-weight: 900;
      letter-spacing: -0.02em;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, .35),
        0 10px 28px rgba(243, 213, 106, .28);
    }
    .tool:hover { filter: brightness(1.06); transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>리니지 클래식</h1>
      <p class="lead">도건유튜브</p>
    </header>
    <div class="tools">
      <a class="tool" href="https://linkstyle84-sketch.github.io/lin-dps/">리니지 클래식 무기 DPS 측정기</a>
    </div>
  </div>
</body>
</html>
