<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리니지 클래식 · 도건유튜브</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0a08;
      --ink: #f6edd6;
      --muted: #cbb994;
      --gold: #e4c36a;
      --line: rgba(228, 195, 106, 0.28);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(900px 380px at 50% -60px, #3a2410 0%, transparent 62%),
        var(--bg);
      color: var(--ink);
      font-family: "Noto Sans KR", sans-serif;
    }
    .wrap {
      width: min(760px, calc(100% - 28px));
      margin: 0 auto;
      padding: 48px 0 56px;
    }
    .tools { display: grid; gap: 12px; }
    .tool {
      display: block;
      padding: 0;
      border-radius: 16px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
    }
    .tool img {
      display: block;
      width: 100%;
      height: auto;
    }
    .tool:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .shortcuts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    .speed-banners { display: grid; gap: 12px; }
    .speed-banner {
      display: block;
      padding: 0;
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .35);
    }
    .speed-banner img { display: block; width: 100%; height: auto; }
    .speed-banner:hover { filter: brightness(1.06); transform: translateY(-1px); }
    .yt {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 64px;
      padding: 16px 12px;
      border-radius: 16px;
      border: 2px solid var(--gold);
      background: rgba(228, 195, 106, 0.1);
      color: var(--gold);
      text-align: center;
      text-decoration: none;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: -0.02em;
      line-height: 1.35;
    }
    .yt:hover { filter: brightness(1.08); transform: translateY(-1px); }
    .banner-row {
      display: grid;
      grid-template-columns: 1fr 27%;
      align-items: stretch;
      width: 100%;
      margin: 0 0 16px;
      overflow: hidden;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: #0a1220;
    }
    .banner-row img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: contain;
      object-position: center center;
    }
    .member-cta {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      padding: 8px 10px;
      text-decoration: none;
      text-align: center;
      color: #f6ebd4;
      background: linear-gradient(#6b3f24, #3d2416);
      border-left: 2px solid #2a160e;
      font-weight: 800;
      line-height: 1.25;
    }
    .member-cta:hover { filter: brightness(1.08); }
    .member-cta strong { font-size: clamp(13px, 2.2vw, 18px); }
    .member-cta span { font-size: clamp(11px, 1.7vw, 14px); color: #f0d2a8; }
    .member-cta .alarm { font-size: clamp(11px, 1.5vw, 13px); white-space: nowrap; }
    .banner {
      display: grid;
      place-items: center;
      min-height: 96px;
      margin-bottom: 28px;
      border-radius: 16px;
      border: 1px dashed var(--gold);
      background: rgba(228, 195, 106, 0.06);
      color: var(--gold);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.04em;
    }
    .ad-contact {
      margin: 36px 0 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.7;
    }
    .ad-contact strong {
      display: block;
      margin-bottom: 4px;
      color: var(--gold);
      font-size: 16px;
    }
    .ad-contact a { color: inherit; text-decoration: none; }
    .ad-contact a:hover { color: #fffdf6; text-decoration: underline; }
    .counts {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 28px;
      margin-top: 28px;
      padding: 14px 18px;
      border-radius: 16px;
      border: 1px solid var(--line);
      background: rgba(228, 195, 106, 0.06);
      color: var(--muted);
      font-size: 15px;
      font-weight: 800;
      text-align: center;
    }
    .counts b { color: var(--gold); font-size: 18px; font-weight: 900; }
    @media (max-width: 640px) {
      .banner-row { grid-template-columns: 1fr; }
      .banner-row img { height: auto; }
      .member-cta { padding: 12px 10px; border-left: 0; border-top: 2px solid #2a160e; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="banner-row">
      <img src="banner.png" alt="도건유튜브">
      <a class="member-cta" href="https://www.youtube.com/channel/UCk6f0jViRYWOi5BcHaDLZXQ/join" target="_blank" rel="noopener">
        <strong>도건형 커피값 투척</strong>
        <span>+멤버쉽가입 여기클릭</span>
        <span class="alarm">구독 좋아요 알람설정!</span>
      </a>
    </div>
    <div class="banner">배너 광고 구함</div>
    <div class="tools">
      <div class="shortcuts">
        <a class="yt" href="https://www.youtube.com/user/linkstyle84" target="_blank" rel="noopener">도건유튜브 바로가기</a>
        <a class="yt" href="https://open.kakao.com/o/gL2Xyl9h" target="_blank" rel="noopener">도건 린클 연구소 단톡방 바로가기</a>
      </div>
      <div class="speed-banners">
        <a class="speed-banner" href="speed-knight.html"><img src="btn-knight.jpg" alt="기사/군주 공격속도"></a>
        <a class="speed-banner" href="speed-elf.html"><img src="btn-elf.jpg" alt="요정 공격속도"></a>
        <a class="speed-banner" href="speed-mage.html"><img src="btn-mage.jpg" alt="법사 공격속도"></a>
      </div>
      <a class="tool" href="https://linkstyle84-sketch.github.io/lin-dps/"><img src="dps-tool.jpg" alt="리니지 클래식 무기 DPS 측정기"></a>
    </div>
    <p class="ad-contact">
      <strong>배너 광고 문의</strong>
      카톡: linkstyle7<br>
      이메일: <a href="mailto:linkstyle84@gmail.com">linkstyle84@gmail.com</a>
    </p>
    <p class="counts"><span>방문자 수: <b id="guide">…</b></span><span>무기 DPS 측정기 방문자수: <b id="tool">…</b></span></p>
  </div>
  <script src="../count.js?v=3"></script>
  <script>
    function paintCount(key, n) {
      document.getElementById(key).textContent = n == null ? '-' : String(n);
    }
    function asPromise(value) {
      if (value && typeof value.then === 'function') return value;
      return Promise.resolve(null);
    }
    if (window.LinCount) {
      LinCount.read('tool').then(function (n) { paintCount('tool', n); });
      asPromise(LinCount.hit('guide', false)).then(function (n) {
        if (n == null) LinCount.read('guide').then(function (v) { paintCount('guide', v); });
        else paintCount('guide', n);
      });
    }
  </script>
</body>
</html>
