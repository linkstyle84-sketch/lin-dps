    <h1>인트 INT 마댐 · SP · 명중</h1>
    <p class="note">법사 인트 마법보너스입니다. SP와 마법명중에 같은 수치가 더해집니다. 20에서 +2까지 확인됐고, 21부터는 아직 측정 전입니다. 마법 대미지는 인트가 오르면 같이 오르고, 2026년 4월 8일 업데이트에서 증가폭이 올랐습니다. 구간별 마댐 숫자는 아직 이 표에 없습니다.</p>
