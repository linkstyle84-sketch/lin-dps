<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>리니지 클래식 DPS 측정기</title>
  <style>
/* 글꼴: 갈무리 Galmuri 11 (SIL Open Font License) https://github.com/quiple/galmuri */
@font-face {
  font-family: "LinText";
  src: url("fonts/Galmuri11.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}
@font-face {
  font-family: "LinNum";
  src: url("fonts/Galmuri11-Bold.woff2") format("woff2");
  font-weight: 400;
  font-style: normal;
  font-display: swap;
}

:root {
  --bg: #121212;
  --panel: #1b1b1b;
  --panel-2: #242018;
  --line: #b08a3e;
  --line-dim: #6e5524;
  --text: #ffffff;
  --muted: #ffffff;
  --gold: #f6e27a;
  --gold-2: #ffe9a0;
  --num: #ffffff;
  --danger: #e07a72;
  --bar: #e2c15a;
  --stone: #1a1a1a;
  color-scheme: dark;
  font-family: "LinText", sans-serif;
}

* { box-sizing: border-box; }
html, body {
  margin: 0;
  min-height: 100%;
  background: #070605 url("classic-bg.jpg") center / cover no-repeat fixed;
  color: var(--text);
  font-family: "LinText", sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: none;
  -moz-osx-font-smoothing: unset;
  text-rendering: optimizeSpeed;
}
.stage {
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 28px 18px;
  box-sizing: border-box;
}
.window {
  position: relative;
  width: min(1560px, 100%);
  margin: auto;
  background: rgba(8, 6, 4, 0.92);
  border: 2px solid #e6c36a;
  box-shadow:
    0 0 0 1px #2a1c0c,
    0 0 0 6px #120e0a,
    0 0 0 7px #8a6a32,
    0 0 0 10px #1a120c,
    0 22px 50px rgba(0, 0, 0, 0.55);
}
.window:before, .window:after {
  content: "";
  position: absolute;
  width: 14px;
  height: 14px;
  border: 2px solid #f0d78a;
  pointer-events: none;
}
.window:before { top: -6px; left: -6px; border-right: 0; border-bottom: 0; }
.window:after { top: -6px; right: -6px; border-left: 0; border-bottom: 0; }
.corners { position: absolute; inset: 0; pointer-events: none; }
.corners i { position: absolute; width: 14px; height: 14px; border: 2px solid #f0d78a; }
.corners i:first-child { left: -6px; bottom: -6px; border-right: 0; border-top: 0; }
.corners i:last-child { right: -6px; bottom: -6px; border-left: 0; border-top: 0; }
button, input, select {
  font-family: "LinText", sans-serif;
  color: var(--text);
  -webkit-font-smoothing: none;
}
button { cursor: pointer; }
.num, input, .dps-num, .chip b, .bar-val, td.num, select.enchant {
  font-family: "LinNum", sans-serif;
  color: var(--num);
}

header.top {
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center;
  gap: 8px 16px;
  padding: 16px 16px 6px;
}
header.top h1 { grid-column: 2; grid-row: 1; margin: 0; font-size: 22px; font-weight: 400; letter-spacing: 0.08em; color: var(--gold); text-align: center; }
.brand { display: contents; }
.credit-row { grid-column: 1 / -1; grid-row: 2; display: flex; justify-content: space-between; align-items: baseline; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
header.top p { margin: 0; color: var(--text); font-size: 14px; }
header.top a.channel { color: inherit; text-decoration: none; }
header.top a.channel:hover { color: var(--gold-2); text-decoration: underline; }
.top-actions { grid-column: 3; grid-row: 1; justify-self: end; display: flex; gap: 8px; flex-wrap: wrap; }

.layout {
  display: grid;
  grid-template-columns: minmax(280px, 348px) minmax(0, 1fr);
  gap: 14px;
  padding: 8px 16px 24px;
  align-items: start;
  width: 100%;
}
main { min-width: 0; }

.panel, .table-wrap {
  background: transparent;
  border: 0;
  border-radius: 0;
  box-shadow: none;
}
.summary {
  background: rgba(0, 0, 0, 0.35);
  border: 1px solid #6a4a16;
  border-radius: 2px;
  box-shadow: none;
  color: #f4f4f4;
}
.panel { padding: 12px 12px 10px; }
.panel.left { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
.panel.left h2, .right-head h2 { margin: 0 0 8px; font-size: 14px; letter-spacing: 0; color: var(--gold); }
.block-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
.panel.left .block-head h2 {
  margin: 0;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}
.panel.left .block-head h2::before,
.panel.left .block-head h2::after {
  content: "";
  flex: 1;
  height: 2px;
  background: var(--gold);
}
.block-head .summary { margin: 0; padding: 4px 8px; white-space: nowrap; }
.block + .block { margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line-dim); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 2px; overflow: hidden; }
.tabs button { border: 0; border-radius: 0; background: #141414; padding: 8px 0; color: var(--muted); }
.tabs button + button { border-left: 1px solid var(--line-dim); }
.tabs button.on { background: #3a3016; color: var(--gold-2); box-shadow: inset 0 0 0 1px var(--line); }

.seg { display: flex; gap: 6px; margin-bottom: 10px; }
.seg button, .ghost, .add {
  border: 1px solid var(--line);
  background: #16130e;
  border-radius: 2px;
  padding: 7px 10px;
  color: var(--text);
}
.seg button.on { background: #3a3016; border-color: var(--line); color: var(--gold-2); }
.ghost.small, .add { font-size: 14px; padding: 6px 8px; }
.ghost:hover, .add:hover, .seg button:hover, .tabs button:hover { border-color: var(--gold-2); color: var(--gold-2); }

.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 6px; }
.grid2 > * { min-width: 0; }
.vic-row { display: grid; grid-template-columns: minmax(0, 0.85fr) minmax(0, 0.85fr) minmax(0, 1.3fr); gap: 6px; }
.vic-row > * { min-width: 0; }
.vic-row label.field.inline { gap: 4px; margin-bottom: 0; }
label.field { display: flex; flex-direction: column; gap: 3px; font-size: 14px; color: var(--text); margin-bottom: 6px; }
label.field.inline { flex-direction: row; align-items: center; gap: 6px; margin-bottom: 4px; min-width: 0; }
label.field.inline .field-name, .stat-col .field-name { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; flex: none; }
label.field.inline input { width: 0; flex: 1; min-width: 0; }
label.field.inline input::placeholder { color: #b7a98a; font-size: 12px; opacity: 1; }
.emo { font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif; font-size: 15px; line-height: 1; }
.stat-col { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 6px; row-gap: 3px; align-items: center; margin-bottom: 6px; }
.stat-col .substat { grid-column: 2; margin: 0; }
.atk-grid {
  display: grid;
  grid-template-columns: auto 58px minmax(0, 1fr);
  column-gap: 8px;
  row-gap: 6px;
  align-items: center;
  margin-bottom: 6px;
}
.atk-grid .field-name { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.atk-grid .atk-extra { display: none; }
.atk-bonus { display: flex; gap: 8px; margin: 0; font-size: 13px; line-height: 1.3; color: var(--text); white-space: nowrap; }
.atk-bonus .num { font-size: 15px; line-height: 1; }
label.field input, .stat-col input, .atk-grid input, select.bare, select.cell {
  background: #101010;
  border: 1px solid var(--line-dim);
  border-radius: 2px;
  padding: 5px 8px;
  width: 100%;
}
label.field input, .stat-col input, .atk-grid input { font-size: 16px; line-height: 1; }
.atk-grid input {
  width: 58px;
  min-width: 0;
  padding: 5px 4px;
  text-align: center;
  -moz-appearance: textfield;
  appearance: textfield;
}
.atk-grid input::-webkit-outer-spin-button,
.atk-grid input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.atk-grid input::placeholder { color: #b7a98a; font-size: 12px; opacity: 1; }
.vic-row label.field input { padding: 5px 4px; -moz-appearance: textfield; appearance: textfield; }
.vic-row label.field input::-webkit-outer-spin-button,
.vic-row label.field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hint { color: var(--muted); font-size: 14px; margin: -2px 0 6px; }
.substat { margin: -4px 0 8px; font-size: 14px; color: var(--text); }
.substat .num, .summary .num { font-size: 16px; line-height: 1; }
.field-title { line-height: 1.45; }
.field-note { color: var(--muted); }

.mat-list { max-height: 280px; overflow: auto; display: flex; flex-direction: column; gap: 8px; }
.mat-type h3 { margin: 0 0 4px; font-size: 14px; color: var(--gold); font-weight: 400; }
.mat-row { display: grid; grid-template-columns: 1fr 108px; gap: 6px; align-items: center; margin-bottom: 4px; font-size: 14px; }
.mat-row select { background: #101010; border: 1px solid var(--line-dim); color: var(--text); padding: 4px 6px; }
.group { margin-top: 8px; }
.group h3, #arrows h3 { margin: 0 0 4px; font-size: 14px; color: var(--gold); font-weight: 400; }
.checks, .arrows, .buff-mix { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 8px; align-items: center; }
.skill-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 42px;
  padding: 4px 6px;
  border: 1px solid #3a3120;
  border-radius: 2px;
  background: #101010;
  color: #fff;
  text-align: left;
}
.skill-btn svg, .skill-btn img { width: 32px; height: 32px; flex: none; image-rendering: pixelated; opacity: 0.45; }
.skill-btn .skill-name { display: flex; flex-direction: column; justify-content: center; min-width: 0; font-size: 12px; line-height: 1.25; }
.skill-btn .skill-name span { font-size: 12px; line-height: 1.25; white-space: nowrap; }
.skill-btn.on {
  border-color: var(--gold);
  color: var(--gold-2);
  background: #2a2416;
  box-shadow: inset 0 3px 0 #120e08, inset 0 0 0 1px #6e5524;
  transform: translateY(1px);
}
.skill-btn.on svg, .skill-btn.on img { opacity: 1; }
.checks label, .arrows label { display: flex; gap: 5px; align-items: center; font-size: 14px; min-width: 0; color: var(--text); }
input[type="checkbox"], input[type="radio"] { accent-color: #e2c15a; }
.summary {
  margin-top: 8px;
  padding: 6px 8px;
  color: #f4f4f4;
  font-size: 14px;
}
body.class-knight .elf-only { display: none; }
body.class-elf .knight-only { display: none; }

.right-head { display: flex; justify-content: space-between; gap: 12px; align-items: center; margin-bottom: 10px; }
.right-head h2 { margin: 0; }
.right-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }

.hero {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0;
  margin: 0;
  background: none;
  border: 0;
  box-shadow: none;
}
.hero-top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.hero-id { display: flex; gap: 10px; align-items: center; min-width: 0; }
.weapon-art { width: 64px; height: 64px; object-fit: none; image-rendering: auto; flex: none; background: #101010; border: 1px solid var(--line-dim); box-sizing: content-box; }
.kicker { color: var(--text); font-size: 14px; letter-spacing: 0; }
.hero h3 { margin: 4px 0; font-size: 26px; font-weight: 400; color: var(--gold); }
.hero h3 .num { font-size: 26px; }
.hero .meta { color: var(--muted); font-size: 14px; margin-bottom: 8px; }
.lines { margin: 0; padding-left: 16px; color: var(--text); font-size: 14px; line-height: 1.7; }
.lines .num { font-size: 14px; }
.dps-block { text-align: right; }
.dps-label { color: var(--muted); font-size: 14px; }
.dps-num { font-size: 32px; line-height: 1; font-weight: 400; color: var(--num); }
.dps-unit { font-family: "LinText", sans-serif; font-size: 14px; color: var(--text); margin-left: 4px; }
.chips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.chip { background: rgba(0, 0, 0, 0.35); border: 1px solid var(--line-dim); border-radius: 2px; padding: 6px 8px; text-align: left; }
.chip b { display: block; font-size: 16px; font-weight: 400; line-height: 1.1; }
.chip span { color: var(--text); font-size: 14px; }
.warn { color: var(--danger); }

.bar-row { display: grid; grid-template-columns: 92px 1fr 56px; gap: 8px; align-items: center; font-size: 14px; color: var(--text); }
.bar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-name .num { font-size: 14px; }
.bar-track { height: 10px; background: #101010; border: 1px solid var(--line-dim); border-radius: 0; overflow: hidden; }
.bar-fill { height: 100%; background: linear-gradient(90deg, #8a6a2e, var(--bar)); }
.bar-val { text-align: right; font-size: 14px; }
.compare-tabs { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 10px; }
.compare-tabs button.small { font-size: 16px; padding: 8px 14px; }
.compare-tabs .on { background: #3a3016; color: var(--gold-2); }
.compare-note { margin: 0 0 14px; color: var(--text); font-size: 15px; }
.cmp-list { display: flex; flex-direction: column; gap: 4px; }
.cmp-line, .cmp-head {
  display: grid;
  grid-template-columns: 42px 72px minmax(150px, 240px) 1fr auto;
  gap: 14px;
  align-items: center;
}
.cmp-line { min-height: 78px; margin-bottom: 6px; }
.cmp-weapon { margin: 0 0 18px; padding-bottom: 8px; border-bottom: 1px solid #3a3120; }
.cmp-thumb {
  width: 64px;
  height: 64px;
  box-sizing: content-box;
  object-fit: none;
  image-rendering: auto;
  background: #101010;
  border: 1px solid var(--line);
}
span.cmp-thumb { display: block; }
.cmp-rank { font-size: 26px; color: var(--gold-2); text-align: center; }
.cmp-label { font-size: 20px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cmp-label .num { font-size: 20px; }
.cmp-line .bar-track { height: 26px; }
.cmp-score { font-size: 26px; text-align: right; min-width: 72px; }
.cmp-total { font-size: 16px; white-space: nowrap; }
.cmp-total b { font-size: 24px; font-weight: 400; color: var(--gold-2); }
.cmp-bars { display: flex; flex-direction: column; gap: 8px; padding: 8px 0 0 128px; }
.cmp-bars .bar-row { grid-template-columns: 108px 1fr 64px; font-size: 16px; }
.cmp-bars .bar-name .num, .cmp-bars .bar-val { font-size: 16px; }
.cmp-bars .bar-track { height: 18px; }
.modal-card.wide { width: min(1100px, 100%); }

.modal[hidden] { display: none; }
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 24px; }
.modal-back { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.66); }
.modal-card {
  position: relative;
  width: min(880px, 100%);
  max-height: min(820px, calc(100vh - 48px));
  overflow: auto;
  padding: 14px 16px 16px;
  background: rgba(8, 6, 4, 0.96);
  border: 2px solid #e6c36a;
  border-radius: 0;
  box-shadow:
    0 0 0 1px #2a1c0c,
    0 0 0 6px #120e0a,
    0 0 0 7px #8a6a32,
    0 22px 50px rgba(0, 0, 0, 0.55);
}
.modal-tools { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
.modal-tools h2 { margin: 0; font-size: 14px; font-weight: 400; color: var(--gold); }
.modal-x { border: 0; background: transparent; color: var(--text); font-size: 22px; line-height: 1; padding: 0 4px; }
.modal-x:hover { color: var(--gold-2); }
body.modal-open { overflow: hidden; }

.table-wrap { overflow: auto; max-height: calc(100vh - 110px); width: 100%; max-width: 100%; }
table { width: 100%; border-collapse: collapse; font-size: 18px; }
th, td { padding: 6px 3px; border-bottom: 1px solid #3a3120; white-space: nowrap; text-align: right; }
th { position: sticky; top: 0; background: #120e0a; color: var(--gold); font-weight: 400; z-index: 1; }
th button { background: none; border: 0; color: inherit; padding: 0; font-size: 18px; }
th button[data-sort] { position: relative; }
th button.on { color: var(--gold-2); }
th button.on::after {
  content: "↓";
  position: absolute;
  right: 0;
  top: -9px;
  font-size: 14px;
  line-height: 1;
  color: var(--gold-2);
}
th button.on[data-dir="asc"]::after { content: "↑"; }
#sortClearHead { text-align: left; padding-left: 2px; }
th button.sort-clear {
  border: 1px solid var(--line);
  background: #16130e;
  color: var(--text);
  padding: 1px 6px;
  font-size: 16px;
}
th button.sort-clear:hover { border-color: var(--gold-2); color: var(--gold-2); }
.no-enchant { color: var(--muted); }
.add-row td { text-align: center; border-bottom: 0; }
.add-plus {
  width: 42px;
  height: 28px;
  border: 1px solid var(--line);
  background: #16130e;
  color: var(--gold-2);
  font-size: 20px;
  line-height: 1;
  padding: 0;
}
.add-plus:hover { border-color: var(--gold-2); color: var(--gold-2); }
td.left, th.left { text-align: center; }
td.num { font-size: 18px; }
td .ghost.small { font-size: 18px; }
tr.pick { background: rgba(246, 226, 122, 0.12); }
tr.pick .wpick-btn span { color: var(--gold-2); }
tr:hover { background: rgba(243, 213, 107, 0.06); }
select.cell { max-width: none; color: var(--text); }
select.enchant { width: 86px; color: var(--num); font-size: 18px; }
select.weapon { width: 148px; }
select.transform { width: 176px; }
.menu-art {
  width: 48px;
  height: 48px;
  box-sizing: content-box;
  object-fit: contain;
  image-rendering: auto;
  background: #101010;
  border: 1px solid var(--line-dim);
  display: block;
  flex: none;
}
span.menu-art { display: inline-block; }

  display: flex;
  align-items: center;
  gap: 6px;

  border: 1px solid var(--line-dim);

}

}

}

}

td .x { border: 0; background: transparent; color: var(--muted); padding: 2px 4px; font-size: 22px; }

@media (max-width: 980px) {
  header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: center; }
  .brand { display: block; flex: 1 1 100%; min-width: 0; }

  .credit-row { justify-content: center; }

  .layout { grid-template-columns: 1fr; }

  .table-wrap { max-height: 70vh; }
}
#openSetup { color: var(--gold-2); border-color: var(--gold); }
.setup-card { width: min(760px, 100%); }
.setup-progress { display: flex; gap: 6px; margin: 0 0 12px; }
.setup-progress span {
  width: 22px;
  height: 22px;
  display: grid;
  place-items: center;

/**
 * 구글시트 weapon-formulas.mjs 와 같은 계산.
 * 셀 수식을 흉내 내지 않고, 같은 규칙을 숫자로 계산한다.
 */

const ARROW_OPTIONS = [
  { id: 'none', label: '미착용', dice: 0, undead: 0 },
  { id: 'normal', label: '화살', dice: 6, undead: 0 },
  { id: 'silver', label: '은 화살', dice: 7, undead: 10 },
  { id: 'mithril', label: '미스릴 화살', dice: 10, undead: 10 },
];

const GHOST_ARROW = { id: 'ghost', label: '무형 화살', dice: 7, undead: 0 };

function round1(n) {
  if (!Number.isFinite(n)) return 0;
  return Math.round((n + Number.EPSILON) * 10) / 10;
}

function weaponKey(enchant, name) {
  const enc = Number(String(enchant ?? '').replace('+', '').trim());
  const n = String(name ?? '').trim();
  if (!n || !Number.isFinite(enc)) return '';
  return `${enc} ${n}`;
}

function arrowOf(id) {
  return ARROW_OPTIONS.find((a) => a.id === id) || ARROW_OPTIONS[0];
}

function resolveArrow(profile, weapon) {
  const cls = profile.cls === '기사' ? '기사' : '요정';
  if (cls !== '요정' || weapon.type !== '활') return ARROW_OPTIONS[0];
  if ((!profile.arrow || profile.arrow === 'none') && weapon.name === '사이하의 활') return GHOST_ARROW;
  return arrowOf(profile.arrow);
}

function chosenMaterial(weapon, profile) {
  const mats = profile.materials;
  if (mats && Object.prototype.hasOwnProperty.call(mats, weapon.name)) return mats[weapon.name] || '';
  return weapon.material || '';
}

function meleeUndead(weapon, profile) {
  const mat = chosenMaterial(weapon, profile);
  if (mat === '은' || mat === '미스릴' || mat === '오리하루콘') return weapon.undead > 0 ? weapon.undead : 10;
  if (mat) return 0;
  return weapon.undead;
}

function pair(table, cls, value) {
  const row = table[String(Number(value))];
  if (!row) return { dmg: 0, acc: 0, found: false };
  if (cls === '기사') return { dmg: row.knightDmg, acc: row.knightAcc, found: true };
  return { dmg: row.elfDmg, acc: row.elfAcc, found: true };
}

function growthOf(db, cls, level, stat) {
  const lv = pair(db.levels, cls, level);
  const st = pair(db.stats, cls, stat);
  return { levelDmg: lv.dmg, levelAcc: lv.acc, statDmg: st.dmg, statAcc: st.acc };
}

function summarize(db, profile) {
  const cls = profile.cls === '기사' ? '기사' : '요정';
  const on = profile.buffs || {};
  let dmg = 0;
  let acc = 0;
  let dr = 0;
  let meleeDmg = 0;
  let meleeAcc = 0;
  for (const b of db.buffs) {
    if (b.direct === 'dmg' || b.direct === 'dr') continue;
    if (b.pickOne === 'elf_ranged') continue;
    if (b.scope === 'victim') {
      if (on[b.id]) dr += b.dr;
      continue;
    }
    const scopeOk = b.scope === 'common' || b.scope === (cls === '기사' ? 'knight' : 'elf');
    if (!scopeOk || !on[b.id]) continue;
    if (b.melee) {
      meleeDmg += b.dmg;
      meleeAcc += b.acc;
      continue;
    }
    dmg += b.dmg;
    acc += b.acc;
  }
  if (cls === '요정' && profile.elfRanged) {
    const picked = db.buffs.find((b) => b.id === profile.elfRanged && b.pickOne === 'elf_ranged');
    if (picked) {
      dmg += picked.dmg;
      acc += picked.acc;
    }
  }
  dmg += Number(profile.extraDmg) || 0;
  dr += Number(profile.extraDr) || 0;
  return { buffDmg: dmg, buffAcc: acc, dr, meleeDmg, meleeAcc };
}

function lookupAps(db, transform, cls, type) {
  const row = db.aps[transform];
  if (!row) return null;
  const key = `${cls}_${type}`;
  if (!Object.prototype.hasOwnProperty.call(row, key)) return null;
  return row[key];
}

function lookupHit(db, ac, acc) {
  const acKey = String(Number(ac));
  const accKey = String(Number(acc));
  const row = db.hit[acKey];
  if (!row || !Object.prototype.hasOwnProperty.call(row, accKey)) return null;
  return row[accKey];
}

function hitDamage(parts, dice, extra) {
  return Math.max(
    0,
    dice +
      parts.flat +
      parts.encStep +
      parts.encTier +
      parts.spell +
      parts.sp +
      parts.buffDmg +
      parts.levelDmg +
      parts.statDmg +
      extra -
      parts.dr,
  );
}

function dpsOf(dmg, hitRate, aps) {
  if (hitRate == null || aps == null || aps === 0) return 0;
  return round1(dmg * (hitRate / 100) * aps);
}

function calcRow(db, profile, row) {
  const name = String(row?.name ?? '').trim();
  if (!name || name === '(빈칸)') return { empty: true };
  const enchant = Number(String(row.enchant ?? '').replace('+', '').trim());
  const key = weaponKey(enchant, name);
  let weapon = db.weapons[key];
  if (!weapon && db.weapons[`0 ${name}`]?.noEnchant) weapon = db.weapons[`0 ${name}`];
  if (!weapon) return { missing: true, name, enchant };

  const cls = profile.cls === '기사' ? '기사' : '요정';
  const isBow = weapon.type === '활';
  const arrow = resolveArrow(profile, weapon);
  const sums = summarize(db, profile);
  const blocked = !!weapon.noEnchant;
  const encStep = blocked ? 0 : Math.max(0, enchant);
  const encTier = blocked ? 0 : enchant >= 11 ? 5 : enchant >= 10 ? 2 : 0;
  const stat = pair(db.stats, cls, profile.stat);
  const level = pair(db.levels, cls, profile.level);
  const levelDmg = cls === '기사' ? (isBow ? 0 : level.dmg) : isBow ? level.dmg : 0;
  let sp = 0;
  if (weapon.sp) {
    const boosted = pair(db.stats, cls, Number(profile.stat) + weapon.sp);
    if (stat.found && boosted.found) sp = Math.max(0, boosted.dmg - stat.dmg);
  }

  const parts = {
    weaponDice: weapon.small,
    weaponDiceLarge: weapon.large,
    arrowDice: arrow.dice,
    diceSmall: (weapon.small + arrow.dice + 1) / 2,
    diceLarge: (weapon.large + arrow.dice + 1) / 2,
    flat: weapon.flat,
    encStep,
    encTier,
    spell: weapon.spell,
    sp,
    buffDmg: sums.buffDmg + (isBow ? 0 : sums.meleeDmg),
    levelDmg,
    statDmg: stat.dmg,
    dr: sums.dr,
    undeadBase: (isBow ? 0 : meleeUndead(weapon, profile)) + arrow.undead,
    undeadMax: 0,
    undeadAvg: 0,
    weaponAcc: weapon.acc,
    buffAcc: sums.buffAcc + (isBow ? 0 : sums.meleeAcc),
    levelAcc: level.acc,
    statAcc: stat.acc,
  };
  parts.undeadMax = parts.undeadBase > 0 ? parts.undeadBase + (blocked ? 0 : enchant) : 0;
  parts.undeadAvg = parts.undeadMax > 0 ? (parts.undeadMax + 1) / 2 : 0;

  const avgHit = hitDamage(parts, parts.diceSmall, 0);
  const avgLarge = hitDamage(parts, parts.diceLarge, 0);
  const avgUndeadSmall = hitDamage(parts, parts.diceSmall, parts.undeadAvg);
  const avgUndeadLarge = hitDamage(parts, parts.diceLarge, parts.undeadAvg);
  const acc =
    parts.weaponAcc + parts.encStep + parts.buffAcc + parts.levelAcc + parts.statAcc;

  const tableHit = lookupHit(db, profile.ac, acc);
  let hitRate = null;
  let hitNote = '';
  const erApplied = isBow;
  if (tableHit == null) hitNote = '데이터 없음';
  else if (isBow) hitRate = Math.max(5, tableHit - (Number(profile.er) || 0));
  else hitRate = tableHit;

  const transform = String(row.transform ?? '').trim();
  let aps = null;
  let apsNote = '';
  if (transform) {
    const speed = lookupAps(db, transform, cls, weapon.type);
    if (speed == null || speed === 0) {
      if (cls === '요정' && !isBow) apsNote = '활만';
      else if (cls === '기사' && isBow) apsNote = '근거리만';
      else apsNote = '';
    } else {
      aps = speed;
    }
  }

  return {
    empty: false,
    missing: false,
    name,
    enchant,
    type: weapon.type,
    transform,
    aps,
    apsNote,
    acc,
    hitRate,
    hitNote,
    tableHit,
    erApplied,
    avgHit,
    avgLarge,
    avgUndeadSmall,
    avgUndeadLarge,
    dpsSmall: dpsOf(avgHit, hitRate, aps),
    dpsLarge: dpsOf(avgLarge, hitRate, aps),
    dpsUndeadSmall: dpsOf(avgUndeadSmall, hitRate, aps),
    dpsUndeadLarge: dpsOf(avgUndeadLarge, hitRate, aps),
    parts,
  };
}

function defaultBuffs() {
  const buffs = {};
  let ranged = null;
  for (const b of DB.buffs) {
    if (b.direct) continue;
    if (b.pickOne === 'elf_ranged') {
      if (b.defaultOn) ranged = b.id;
      continue;
    }
    buffs[b.id] = !!b.defaultOn;
  }
  return { buffs, elfRanged: ranged };
}

function rowFrom(name, enchant, transform) {
  state.seq += 1;
  return { id: state.seq, name, enchant, transform };
}

function classPreset(cls) {
  return cls === '기사' ? KNIGHT_PRESET : ELF_PRESET;
}

const TRANSFORM_LADDER = {
  기사: [
    [1, 'Lv1 샤르나'],
    [51, 'Lv51 커츠'],
    [52, 'Lv52 데스나이트'],
    [55, 'Lv55 다크나이트'],
  ],
  요정: [
    [1, 'Lv1 샤르나'],
    [51, 'Lv51 불타는 궁수'],
    [52, 'Lv52 다크엘프'],
    [55, 'Lv55 다크레인저'],
  ],
};

function transformForLevel(cls, level) {
  const ladder = TRANSFORM_LADDER[cls] || TRANSFORM_LADDER['요정'];
  const lv = Number(level) || 0;
  let name = ladder[0][1];
  for (const [need, next] of ladder) {
    if (lv >= need) name = next;
  }
  return name;
}

function applyLevelTransform() {
  const name = transformForLevel(state.cls, state.level);
  for (const row of state.rows) row.transform = name;
}

function useClassWeapons(cls) {
  const preset = classPreset(cls);
  const transform = transformForLevel(cls, state.level);
  state.rows = preset.rows.map(([name, enchant]) => rowFrom(name, enchant, transform));
  state.selectedId = null;
}

function applyPreset(preset) {
  const base = defaultBuffs();
  state.cls = preset.cls;
  state.level = preset.level;
  state.stat = preset.stat;
  state.ac = preset.ac;
  state.er = preset.er;
  state.arrow = preset.arrow;
  state.extraDmg = preset.extraDmg;
  state.extraDr = preset.extraDr;
  state.buffs = base.buffs;
  state.elfRanged = base.elfRanged;
  state.rows = preset.rows.map(([name, enchant]) => rowFrom(name, enchant, transformForLevel(preset.cls, preset.level)));
  state.selectedId = null;
  writeControls();
  applyClassUi();
  refresh();
}

function load() {
  try {
    const raw = localStorage.getItem('lin-dps-html-v2');
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (!saved || !Array.isArray(saved.rows)) return false;
    Object.assign(state, saved);
    if (!state.materials) state.materials = {};
    state.seq = Math.max(state.seq || 1, ...state.rows.map((r) => r.id || 0));
    return true;
  } catch {
    return false;
  }
}

function save() {
  const { cls, level, stat, ac, er, arrow, elfRanged, extraDmg, extraDr, buffs, rows, seq, sortKey, sortDir, selectedId, materials } = state;
  localStorage.setItem('lin-dps-html-v2', JSON.stringify({ cls, level, stat, ac, er, arrow, elfRanged, extraDmg, extraDr, buffs, rows, seq, sortKey, sortDir, selectedId, materials }));
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function fmtNum(n) {
  if (!Number.isFinite(n)) return '—';
  const r = Math.round(n * 100) / 100;
  return String(r);
}

function fmtPlus(n) {
  return `+${fmtNum(Number.isFinite(n) ? n : 0)}`;
}

function paintNums(text) {
  return esc(text).replace(/[+\-−]?\d+(?:\.\d+)?%?/g, (m) => `<span class="num">${m}</span>`);
}

function fmtAps(n) {
  return (Math.round(n * 1000) / 1000).toFixed(3);
}

function intOr(value, fallback) {
  const n = Number(String(value).trim());
  return Number.isFinite(n) ? n : fallback;
}

function profile() {
  const buffs = { ...state.buffs };
  for (const b of DB.buffs) {
    if (b.scope === 'victim') buffs[b.id] = false;
  }
  return {
    cls: state.cls,
    level: state.level,
    stat: state.stat,
    ac: state.ac,
    er: state.er,
    arrow: state.arrow,
    elfRanged: state.elfRanged,
    extraDmg: state.extraDmg,
    extraDr: state.extraDr,
    materials: state.materials || {},
    buffs,
  };
}

function transformsFor(cls) {
  return DB.transforms.filter((t) => t.classes.includes(cls));
}

function weaponOption(name) {
  return DB.weaponOptions.find((w) => w.name === name);
}

  '윈드샷', '아이오브스톰', '스톰샷', '인챈트웨폰', '전강', '음식명중', '음식추타',

function skillBtn(b, on, mode) {

  }

    ? '<span>브레스 오브</span><span>파이어</span>'
    : `<span>${esc(b.label)}</span>`;

}

function splitBuffs() {
  const common = [];
  const knight = [];
  const elf = [];
  const elfPick = [];
  for (const b of DB.buffs) {
    if (b.direct === 'dmg' || b.direct === 'dr') continue;
    if (b.scope === 'victim') continue;
    if (b.pickOne === 'elf_ranged') elfPick.push(b);
    else if (b.scope === 'knight') knight.push(b);
    else if (b.scope === 'elf') elf.push(b);
    else common.push(b);
  }
  return { common, knight, elf, elfPick };
}

function elfCommonBuffs(common, elf) {
  const elfOrder = ['전강', '인챈트웨폰', '음식명중', '음식추타'];
  const list = common.filter((b) => !ELF_HIDE_COMMON.has(b.id)).concat(elf);
  list.sort((a, b) => {
    const ia = elfOrder.indexOf(a.id);
    const ib = elfOrder.indexOf(b.id);
    return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
  });
  return list;
}

function renderBuffs() {
  const box = document.getElementById('buffs');
  const { common, knight, elf, elfPick } = splitBuffs();
  const cell = (b) => SKILL_IDS.has(b.id) ? skillBtn(b, !!state.buffs[b.id], 'check') : checkBuff(b);
  const group = (title, body) => `<div class="group"><h3>${title}</h3><div class="buff-mix">${body}</div></div>`;
  const parts = [];
  if (state.cls === '기사') {
    parts.push(group('기사', knight.map(cell).join('')));
    parts.push(group('공통', common.map(cell).join('')));
  } else {
    parts.push(group('요정', elfPick.map((b) => skillBtn(b, state.elfRanged === b.id, 'radio')).join('')));
    parts.push(group('공통', elfCommonBuffs(common, elf).map(cell).join('')));
  }
  box.innerHTML = parts.join('');
}

function renderMaterials() {
  const box = document.getElementById('materialBox');
  if (!box) return;
  const groups = new Map();
  for (const opt of DB.weaponOptions) {
    if (opt.type === '활' || opt.type === '화살') continue;
    if (!groups.has(opt.type)) groups.set(opt.type, []);
    groups.get(opt.type).push(opt);
  }
  const mats = state.materials || {};
  const blocks = [];
  for (const [type, list] of groups) {
    const rows = list.map((opt) => {
      const cur = Object.prototype.hasOwnProperty.call(mats, opt.name) ? (mats[opt.name] || '') : (opt.material || '');
      const options = MATERIALS.map((m) => `<option value="${esc(m)}" ${m === cur ? 'selected' : ''}>${m || '미입력'}</option>`).join('');
      return `<label class="mat-row"><span>${esc(opt.name)}</span><select data-mat="${esc(opt.name)}">${options}</select></label>`;
    }).join('');
    blocks.push(`<div class="mat-type"><h3>${esc(type)}</h3>${rows}</div>`);
  }
  box.innerHTML = `<h2>무기 재질</h2><div class="mat-list">${blocks.join('')}</div>`;
}

function metricOf(result) {
  if (!result || result.empty || result.missing) return null;
  if ((state.sortKey === 'dpsUndeadSmall' || state.sortKey === 'dpsUndeadLarge') && !hasUndead(result)) return null;
  return result[state.sortKey];
}

function noEnchantWeapon(name) {
  const opt = weaponOption(name);
  return !!opt && opt.enchants.length === 1 && opt.enchants[0] === 0;
}

function computedRows() {
  for (const row of state.rows) {
    if (row.name && noEnchantWeapon(row.name)) row.enchant = 0;
  }
  const p = profile();
  return state.rows.map((row) => ({ row, result: calcRow(DB, p, row) }));
}

function sortedView(items) {
  if (!state.sortKey) return items.slice();
  const filled = items.filter((item) => item.row.name);
  const empty = items.filter((item) => !item.row.name);
  const dir = state.sortDir === 'asc' ? 1 : -1;
  filled.sort((a, b) => {
    const av = metricOf(a.result);
    const bv = metricOf(b.result);
    const an = av == null ? -Infinity : av;
    const bn = bv == null ? -Infinity : bv;
    if (an !== bn) return (an - bn) * dir;
    return a.row.id - b.row.id;
  });
  return filled.concat(empty);
}

function buildLines(result) {
  if (!result || result.empty) return ['무기를 고르면 계산이 여기에 나옵니다.'];
  if (result.missing) return [`${result.enchant} ${result.name} 이 무기DB에 없습니다.`];
  const p = result.parts;
  const statName = state.cls === '기사' ? 'STR' : 'DEX';
  const dmgBits = [`주사위 (${fmtNum(p.weaponDice)}+${fmtNum(p.arrowDice)}+1)/2 = ${fmtNum(p.diceSmall)}`];
  if (p.flat) dmgBits.push(`추타 ${fmtNum(p.flat)}`);
  if (p.encStep) dmgBits.push(`강화 +${fmtNum(p.encStep)}`);
  if (p.encTier) dmgBits.push(`${p.encTier === 5 ? '11강' : '10강'} 추타 +${fmtNum(p.encTier)}`);
  if (p.spell) dmgBits.push(`발동 ${fmtNum(p.spell)}`);
  if (p.sp) dmgBits.push(`SP ${fmtNum(p.sp)}`);
  if (p.buffDmg) dmgBits.push(`버프 ${fmtNum(p.buffDmg)}`);
  if (p.levelDmg) dmgBits.push(`레벨 ${fmtNum(p.levelDmg)}`);
  if (p.statDmg) dmgBits.push(`${statName} ${fmtNum(p.statDmg)}`);
  if (p.dr) dmgBits.push(`리덕 -${fmtNum(p.dr)}`);
  const lines = [`1타 ${fmtNum(result.avgHit)} = ${dmgBits.join(' + ')}`];
  const accBits = [`무기 ${fmtNum(p.weaponAcc)}`];
  if (p.encStep) accBits.push(`강화 +${fmtNum(p.encStep)}`);
  if (p.buffAcc) accBits.push(`버프 ${fmtNum(p.buffAcc)}`);
  if (p.levelAcc) accBits.push(`레벨 ${fmtNum(p.levelAcc)}`);
  if (p.statAcc) accBits.push(`${statName} ${fmtNum(p.statAcc)}`);
  lines.push(`명중 ${fmtNum(result.acc)} = ${accBits.join(' + ')}`);
  if (result.hitNote) lines.push('명중률 데이터 없음');
  else if (result.erApplied) lines.push(`명중률 ${result.hitRate.toFixed(1)}% = 테이블 ${result.tableHit.toFixed(1)}% − ER ${fmtNum(state.er)}`);
  else lines.push(`명중률 ${result.hitRate.toFixed(1)}%`);
  if (result.apsNote === '활만' || result.apsNote === '근거리만') lines.push(`공속 ${result.apsNote}. 이 무기는 이 클래스 DPS에 넣지 않습니다.`);
  else if (result.aps == null) lines.push('이 변신에는 이 무기 공속이 없습니다.');
  else lines.push(`작몹 DPS ${fmtNum(result.avgHit)} × ${result.hitRate.toFixed(1)}% × ${fmtAps(result.aps)} = ${result.dpsSmall.toFixed(1)}`);
  if (p.undeadAvg > 0) lines.push(`언데드 주사위 1~${fmtNum(p.undeadMax)} (기본 ${fmtNum(p.undeadBase)} + 강화 ${fmtNum(result.enchant)}) → 평균 ${fmtNum(p.undeadAvg)} 가산`);
  else lines.push('언데드 추타 없음');
  lines.push(`큰몹 1타 ${fmtNum(result.avgLarge)} · 언데드 작 1타 ${hasUndead(result) ? fmtNum(result.avgUndeadSmall) : '-'} · 언데드 큰 1타 ${hasUndead(result) ? fmtNum(result.avgUndeadLarge) : '-'}`);
  return lines;
}

function sortLabel() {
  return (SORTS.find((s) => s[0] === state.sortKey) || SORTS[0])[1];
}

function namedRows(view) {
  return view.filter((item) => item.row.name && item.result && !item.result.missing && !item.result.empty);
}

function hasUndead(result) {
  return !!(result && result.parts && result.parts.undeadAvg > 0);
}

function gaugeValue(result, key) {
  if ((key === 'dpsUndeadSmall' || key === 'dpsUndeadLarge') && !hasUndead(result)) return null;
  return Number(result[key]) || 0;
}

function totalScore(result) {
  return GAUGES.reduce((sum, [key]) => sum + (gaugeValue(result, key) || 0), 0);
}

function weaponIcon(name, className) {
  const art = name && typeof WEAPON_IMG !== 'undefined' ? WEAPON_IMG[name] : '';
  if (!art) return `<span class="${className}"></span>`;
  return `<img class="${className}" alt="" src="${art}">`;
}

function weaponThumb(name) {
  return weaponIcon(name, 'cmp-thumb');
}

function barHtml(label, value, max) {
  if (value == null) {
    return `<div class="bar-row"><span class="bar-name">${esc(label)}</span><div class="bar-track"><div class="bar-fill" style="width:0%"></div></div><span class="bar-val num">-</span></div>`;
  }
  const width = max > 0 ? Math.max(0, Math.min(100, (value / max) * 100)) : 0;
  return `<div class="bar-row"><span class="bar-name">${esc(label)}</span><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><span class="bar-val num">${value.toFixed(1)}</span></div>`;
}

function heroHtml(view) {
  const picked = view.find((item) => item.row.id === state.selectedId && item.row.name);
  const result = picked?.result;
  const label = sortLabel();
  const scoreKey = state.sortKey || 'dpsSmall';
  const undeadSort = scoreKey === 'dpsUndeadSmall' || scoreKey === 'dpsUndeadLarge';
  const score = result && !result.missing && !result.empty
    ? (undeadSort && !hasUndead(result) ? null : result[scoreKey])
    : null;
  const scoreText = result && !result.missing && !result.empty && undeadSort && !hasUndead(result)
    ? '-'
    : (score == null ? '—' : Number(score).toFixed(1));
  const title = !picked ? '무기 없음' : result.missing ? '무기 없음' : `+${result.enchant} ${result.name}`;
  const meta = !result || result.empty || result.missing
    ? '무기를 고르면 계산이 여기에 나옵니다.'
    : `${result.type} · ${result.transform || '변신 없음'} · 공속 ${result.apsNote || (result.aps == null ? '—' : fmtAps(result.aps))}`;
  const chips = SORTS.map(([key, name]) => {
    let val = '—';
    if (result && !result.missing && !result.empty) {
      const shown = gaugeValue(result, key);
      val = shown == null ? '-' : shown.toFixed(1);
    }
    return `<div class="chip"><span>${name}</span><b>${val}</b></div>`;
  }).join('');
  const art = result && !result.missing && result.name && typeof WEAPON_IMG !== 'undefined' ? WEAPON_IMG[result.name] : '';
  const weaponImg = art ? `<img class="weapon-art" alt="" src="${art}">` : '';
  return `
    <section class="hero">
      <div class="hero-top">
        <div class="hero-id">
          ${weaponImg}
          <div>
            <div class="kicker">선택 무기 · ${esc(label)}</div>
            <h3>${paintNums(title)}</h3>
            <div class="meta">${paintNums(meta)}</div>
          </div>
        </div>
        <div class="dps-block">
          <div class="dps-label">${esc(label)}</div>
          <div class="dps-num">${scoreText}<span class="dps-unit">/s</span></div>
        </div>
      </div>
      <div class="chips">${chips}</div>
      <ul class="lines">${buildLines(result).map((line) => `<li>${paintNums(line)}</li>`).join('')}</ul>
    </section>
  `;
}

function compareHtml(view) {
  const rows = namedRows(view).map((item) => ({
    item,
    total: totalScore(item.result),
  }));
  const mode = COMPARE_MODES.some(([key]) => key === state.compareMode) ? state.compareMode : 'all';
  rows.sort((a, b) => {
    const av = mode === 'all' ? a.total : (gaugeValue(a.item.result, mode) || 0);
    const bv = mode === 'all' ? b.total : (gaugeValue(b.item.result, mode) || 0);
    return bv - av;
  });
  const tabs = COMPARE_MODES.map(([key, name]) => `<button type="button" class="ghost small${mode === key ? ' on' : ''}" data-compare="${key}">${name}</button>`).join('');
  const note = mode === 'all'
    ? '총점 = 작몹 + 큰몹 + 언데드(작) + 언데드(큰). 총점이 높은 무기가 위입니다.'
    : `${COMPARE_MODES.find(([key]) => key === mode)[1]} DPS가 높은 무기가 위입니다.`;
  if (!rows.length) {
    return `<div class="compare-tabs">${tabs}</div><p class="compare-note">${note}</p><p class="compare-note">비교할 무기가 없습니다.</p>`;
  }
  const maxes = Object.fromEntries(GAUGES.map(([key]) => [key, Math.max(0.01, ...rows.map((row) => gaugeValue(row.item.result, key) || 0))]));
  const singleMax = mode === 'all' ? 0 : Math.max(0.01, ...rows.map((row) => gaugeValue(row.item.result, mode) || 0));
  const body = rows.map((row, index) => {
    const result = row.item.result;
    const name = paintNums(`+${result.enchant} ${result.name}`);
    const thumb = weaponThumb(result.name);
    if (mode === 'all') {
      const gauges = GAUGES.map(([key, label]) => barHtml(label, gaugeValue(result, key), maxes[key])).join('');
      return `<div class="cmp-weapon"><div class="cmp-head"><span class="cmp-rank num">${index + 1}</span>${thumb}<span class="cmp-label">${name}</span><span class="cmp-total">총점 <b class="num">${row.total.toFixed(1)}</b></span></div><div class="cmp-bars">${gauges}</div></div>`;
    }
    const val = gaugeValue(result, mode);
    const shown = val == null ? '-' : val.toFixed(1);
    const width = val == null || singleMax <= 0 ? 0 : Math.max(0, Math.min(100, (val / singleMax) * 100));
    return `<div class="cmp-line"><span class="cmp-rank num">${index + 1}</span>${thumb}<span class="cmp-label">${name}</span><div class="bar-track"><div class="bar-fill" style="width:${width}%"></div></div><span class="cmp-score num">${shown}</span></div>`;
  }).join('');
  return `<div class="compare-tabs">${tabs}</div><p class="compare-note">${note}</p><div class="cmp-list">${body}</div>`;
}

function closePopup() {

  const modal = document.getElementById('modal');
  modal.hidden = true;
  document.getElementById('modal').querySelector('.modal-card')?.classList.remove('wide');
  if (document.getElementById('setup').hidden) document.body.classList.remove('modal-open');
}

function renderPopup(view) {

  }

}

function selectHtml(className, value, options, extra) {
  const has = options.some((o) => o.value === value);
  const head = extra && !has && value ? `<option value="${esc(value)}">${esc(value)}</option>` : '';
  const body = options.map((o) => `<option value="${esc(o.value)}" ${o.value === value ? 'selected' : ''}>${esc(o.label)}</option>`).join('');
  return `<select class="cell ${className}">${head}${body}</select>`;
}

function weaponMenu(selected) {
  const groups = new Map();
  for (const opt of DB.weaponOptions) {
    if (!groups.has(opt.type)) groups.set(opt.type, []);
    groups.get(opt.type).push(opt);
  }
  const items = [`<button type="button" class="wopt${selected ? '' : ' on'}" data-weapon=""><span>(선택)</span></button>`];
  for (const [type, list] of groups) {
    items.push(`<div class="wgroup">${esc(type)}</div>`);
    for (const opt of list) {
      const on = opt.name === selected ? ' on' : '';
      items.push(`<button type="button" class="wopt${on}" data-weapon="${esc(opt.name)}">${weaponIcon(opt.name, 'menu-art')}<span>${esc(opt.name)}</span></button>`);
    }
  }
  const label = selected ? esc(selected) : '(선택)';
  return `<div class="wpick"><button type="button" class="wpick-btn">${weaponIcon(selected, 'menu-art')}<span>${label}</span></button><div class="wpick-menu" hidden>${items.join('')}</div></div>`;
}

function transformIcon(name) {
  if (!name || typeof TRANSFORM_IMG === 'undefined') return '<span class="menu-art"></span>';
  const key = String(name).includes('샤르나') ? '샤르나 변신 주문서' : '변신 주문서';
  const art = TRANSFORM_IMG[key];
  if (!art) return '<span class="menu-art"></span>';
  return `<img class="menu-art" alt="" src="${art}">`;
}

function transformMenu(selected) {
  const items = transformsFor(state.cls).map((t) => {
    const on = t.name === selected ? ' on' : '';
    return `<button type="button" class="wopt${on}" data-transform="${esc(t.name)}">${transformIcon(t.name)}<span>${esc(t.name)}</span></button>`;
  }).join('');
  const label = selected ? esc(selected) : '(선택)';
  const icon = selected ? transformIcon(selected) : '<span class="menu-art"></span>';
  return `<div class="wpick"><button type="button" class="wpick-btn xf">${icon}<span>${label}</span></button><div class="wpick-menu" hidden>${items}</div></div>`;
}

function chooseTransform(row, name) {
  row.transform = name;
  state.selectedId = row.id;
  refresh();
}

function chooseWeapon(row, name) {
  row.name = name;
  const opt = weaponOption(row.name);
  if (opt && !opt.enchants.includes(Number(row.enchant))) {
    row.enchant = opt.enchants.includes(9) ? 9 : opt.enchants[opt.enchants.length - 1];
  }
  state.selectedId = row.id;
  refresh();
}

function closeWeaponMenus() {
  for (const menu of document.querySelectorAll('.wpick-menu')) menu.hidden = true;
}

function openWeaponMenu(btn) {
  const menu = btn.parentElement.querySelector('.wpick-menu');
  const willOpen = menu.hidden;
  closeWeaponMenus();
  if (!willOpen) return;
  const rect = btn.getBoundingClientRect();
  const margin = 8;
  const below = Math.max(0, window.innerHeight - rect.bottom - margin);
  const above = Math.max(0, rect.top - margin);
  const openUp = below < 180 && above > below;
  const space = Math.max(80, Math.min(320, openUp ? above : below));
  menu.style.width = `${Math.max(rect.width, 220)}px`;
  menu.style.maxHeight = `${space}px`;
  menu.hidden = false;
  const height = Math.min(menu.scrollHeight, space);
  const width = menu.offsetWidth;
  const left = Math.max(margin, Math.min(rect.left, window.innerWidth - width - margin));
  const top = openUp ? rect.top - height - 2 : rect.bottom + 2;
  menu.style.left = `${left}px`;
  menu.style.top = `${Math.max(margin, Math.min(top, window.innerHeight - height - margin))}px`;
  const current = menu.querySelector('.wopt.on');
  if (current) menu.scrollTop = Math.max(0, current.offsetTop - 36);
}

function renderTable(view) {
  const body = document.getElementById('weaponBody');
  const addRow = `<tr class="add-row"><td colspan="12"><button type="button" class="add-plus" data-add="1" aria-label="무기 추가">+</button></td></tr>`;
  if (!state.rows.length) {
    body.innerHTML = addRow;
    return;
  }
  body.innerHTML = view.map((item, index) => {
    const row = item.row;
    const result = item.result;
    const opt = weaponOption(row.name);
    const enchants = (opt?.enchants || [6, 7, 8, 9, 10, 11]).map((n) => ({ value: String(n), label: `+${n}` }));
    const locked = noEnchantWeapon(row.name);
    const enchantCell = locked ? '<span class="no-enchant">불가</span>' : selectHtml('enchant', String(row.enchant), enchants);
    const rank = index + 1;
    const apsText = !row.name ? '' : result.missing ? '—' : result.apsNote || (result.aps == null ? '—' : fmtAps(result.aps));
    const apsClass = result && (result.apsNote === '활만' || result.apsNote === '근거리만') ? 'aps-bad' : '';
    const cell = (key, digits) => {
      if (!row.name || !result || result.missing || result.empty) return '—';
      if (result.aps == null) return '—';
      if ((key === 'dpsUndeadSmall' || key === 'dpsUndeadLarge') && !hasUndead(result)) return '-';
      const n = result[key];
      if (digits == null) return fmtNum(n);
      return Number(n).toFixed(digits);
    };
    const hitText = !row.name || !result || result.missing ? '—' : result.hitNote ? result.hitNote : `${result.hitRate.toFixed(1)}%`;
    return `<tr data-id="${row.id}" class="${state.selectedId === row.id ? 'pick' : ''}">
      <td>${rank}</td>
      <td class="left">${enchantCell}</td>
      <td class="left grow">${weaponMenu(row.name)}</td>
      <td class="left grow">${transformMenu(row.transform)}</td>
      <td class="num ${apsClass}">${esc(apsText)}</td>
      <td class="num">${esc(hitText)}</td>
      <td class="num">${cell('dpsSmall', 1)}</td>
      <td class="num">${cell('dpsLarge', 1)}</td>
      <td class="num">${cell('dpsUndeadSmall', 1)}</td>
      <td class="num">${cell('dpsUndeadLarge', 1)}</td>
      <td><button type="button" class="ghost small" data-detail="${row.id}">상세보기</button></td>
      <td><button type="button" class="x" data-del="${row.id}" aria-label="행 삭제">×</button></td>
    </tr>`;
  }).join('') + addRow;
}

function renderSortHeads() {
  const slot = document.getElementById('sortClearHead');
  if (slot) slot.replaceChildren();
  for (const btn of document.querySelectorAll('thead button[data-sort]')) {
    const on = !!state.sortKey && btn.dataset.sort === state.sortKey;
    const base = btn.dataset.label;
    btn.classList.toggle('on', on);
    btn.dataset.dir = on ? state.sortDir : '';
    btn.textContent = base;
  }
  if (state.sortKey && slot) {
    const clear = document.createElement('button');
    clear.id = 'clearSort';
    clear.type = 'button';
    clear.className = 'sort-clear';
    clear.textContent = '해제';
    slot.appendChild(clear);
  }
}

function refresh() {
  const sums = summarize(DB, profile());
  const growth = growthOf(DB, state.cls, state.level, state.stat);
  const extra = Number(state.extraDmg) || 0;
  const statName = state.cls === '기사' ? '힘' : '덱스';
  const pair = (a, b) => `<span>${paintNums(a)}</span><span>${paintNums(b)}</span>`;
  document.getElementById('levelBonus').innerHTML = pair(`렙추타 ${fmtPlus(growth.levelDmg)}`, `렙명중 ${fmtPlus(growth.levelAcc)}`);
  document.getElementById('statBonus').innerHTML = pair(`${statName}추타 ${fmtPlus(growth.statDmg)}`, `${statName}명중 ${fmtPlus(growth.statAcc)}`);
  document.getElementById('baseSummary').innerHTML = paintNums(`추타 ${fmtNum(growth.levelDmg + growth.statDmg + extra)} · 명중 ${fmtNum(growth.levelAcc + growth.statAcc)}`);
  document.getElementById('atkSummary').innerHTML = paintNums(`추타 ${fmtNum(sums.buffDmg - extra + sums.meleeDmg)} · 명중 ${fmtNum(sums.buffAcc + sums.meleeAcc)}`);
  renderArrows();
  renderMaterials();
  const view = sortedView(computedRows());
  renderTable(view);
  renderPopup(view);
  renderSortHeads();
  save();
}

function setupTitle(step) {
  if (step === 2) return state.cls === '기사' ? '힘' : '덱스';
  return SETUP_TITLES[step];
}

function setupBuffHtml(list, mode) {

    return SKILL_IDS.has(b.id) ? skillBtn(b, !!state.buffs[b.id], 'check') : checkBuff(b);

  });
  document.getElementById('btnKnight').addEventListener('click', () => {
    if (state.cls === '기사') return;
    state.cls = '기사';
    useClassWeapons('기사');
    applyClassUi();
    refresh();
  });
  for (const id of ['level', 'stat', 'ac', 'er', 'extraDmg', 'extraDr']) {
    document.getElementById(id).addEventListener('input', (e) => {
      state[id] = intOr(e.target.value, 0);
      if (id === 'level') applyLevelTransform();
      refresh();
    });
  }
  document.getElementById('arrows').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-arrow]');
    if (!btn) return;
    const id = btn.dataset.arrow;
    state.arrow = id === 'none' || state.arrow === id ? 'none' : id;
    refresh();
  });
  document.getElementById('materialBox')?.addEventListener('change', (e) => {
    const name = e.target.dataset.mat;
    if (!name) return;
    if (!state.materials) state.materials = {};
    state.materials[name] = e.target.value;
    refresh();
  });
  const onBuffChange = (e) => {
    const t = e.target;
    if (t.name === 'elfRanged') state.elfRanged = t.value || null;
    if (t.dataset.buff) state.buffs[t.dataset.buff] = t.checked;
    refresh();
  };
  document.getElementById('buffs').addEventListener('change', onBuffChange);
  document.getElementById('buffs').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-skill]');
    if (!btn) return;
    const id = btn.dataset.skill;
    if (btn.dataset.mode === 'radio') state.elfRanged = id && state.elfRanged !== id ? id : null;
    else state.buffs[id] = !state.buffs[id];
    renderBuffs();
    refresh();
  });
  document.getElementById('modal').addEventListener('error', (e) => {
    if (e.target.classList && e.target.classList.contains('weapon-art')) e.target.remove();
  }, true);
  document.getElementById('modal').addEventListener('click', (e) => {
    const mode = e.target.closest('[data-compare]');
    if (mode) {
      state.compareMode = mode.dataset.compare;
      renderPopup(sortedView(computedRows()));
      return;
    }
    if (e.target.closest('[data-close]')) closePopup();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (!document.getElementById('setup').hidden) {
      closeSetup();
      return;
    }
    if (state.popup) closePopup();
  });
  document.getElementById('openSetup').addEventListener('click', openSetup);
  document.getElementById('setup').addEventListener('click', (e) => {
    if (e.target.closest('[data-setup-close]')) {
      closeSetup();
      return;
    }
    const clsBtn = e.target.closest('[data-setup-class]');
    if (clsBtn) {
      const next = clsBtn.dataset.setupClass;
      if (state.cls !== next) {
        state.cls = next;
        useClassWeapons(next);
        applyClassUi();
        writeControls();
        refresh();
      }
      renderSetup();
      return;
    }
    const skill = e.target.closest('[data-skill]');
    if (skill) {
      const id = skill.dataset.skill;
      if (skill.dataset.mode === 'radio') state.elfRanged = id && state.elfRanged !== id ? id : null;
      else state.buffs[id] = !state.buffs[id];
      renderBuffs();
      refresh();
      renderSetup();
      return;
    }
    const arrow = e.target.closest('[data-arrow]');
    if (arrow) {
      const id = arrow.dataset.arrow;
      state.arrow = id === 'none' || state.arrow === id ? 'none' : id;
      renderArrows();
      refresh();
      renderSetup();
    }
  });
  document.getElementById('setupBody').addEventListener('input', (e) => {
    const t = e.target;
    if (t.id === 'setupLevel') {
      state.level = Math.min(99, Math.max(1, intOr(t.value, 1)));
      applyLevelTransform();
      writeControls();
      refresh();
      const growth = growthOf(DB, state.cls, state.level, state.stat);
      const note = document.getElementById('setupLevelBonus');
      if (note) note.textContent = `렙추타 ${fmtPlus(growth.levelDmg)} · 렙명중 ${fmtPlus(growth.levelAcc)}`;
    } else if (t.id === 'setupStat') {
      state.stat = Math.min(50, Math.max(1, intOr(t.value, 1)));
      writeControls();
      refresh();
      const growth = growthOf(DB, state.cls, state.level, state.stat);
      const name = state.cls === '기사' ? '힘' : '덱스';
      const note = document.getElementById('setupStatBonus');
      if (note) note.textContent = `${name}추타 ${fmtPlus(growth.statDmg)} · ${name}명중 ${fmtPlus(growth.statAcc)}`;
    } else if (t.id === 'setupAc' || t.id === 'setupEr' || t.id === 'setupDr') {
      const key = t.id === 'setupAc' ? 'ac' : t.id === 'setupEr' ? 'er' : 'extraDr';
      state[key] = intOr(t.value, 0);
      writeControls();
      refresh();
    }
  });
  document.getElementById('setupPrev').addEventListener('click', () => {
    if (setupStep === 0) return;
    setupStep -= 1;
    renderSetup();
  });
  document.getElementById('setupNext').addEventListener('click', () => {
    if (setupStep >= 7) {
      closeSetup();
      return;
    }
    setupStep += 1;
    renderSetup();
  });
  document.getElementById('resetList').addEventListener('click', () => {
    state.rows = [];
    state.selectedId = null;
    if (state.popup === 'detail') state.popup = null;
    refresh();
  });
  document.getElementById('openCompare').addEventListener('click', () => {
    state.popup = 'compare';
    refresh();
  });
  document.querySelector('thead').addEventListener('click', (e) => {
    if (e.target.closest('#clearSort')) {
      state.sortKey = null;
      refresh();
      return;
    }
    const btn = e.target.closest('button[data-sort]');
    if (!btn) return;
    if (state.sortKey === btn.dataset.sort) state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
    else {
      state.sortKey = btn.dataset.sort;
      state.sortDir = 'desc';
    }
    refresh();
  });
  document.getElementById('weaponBody').addEventListener('click', (e) => {
    const opt = e.target.closest('.wopt');
    if (opt) {
      const tr = opt.closest('tr[data-id]');
      const row = tr && state.rows.find((r) => r.id === Number(tr.dataset.id));
      if (row) {
      if (opt.hasAttribute('data-transform')) chooseTransform(row, opt.dataset.transform || '');
      else chooseWeapon(row, opt.dataset.weapon || '');
    }
      return;
    }
    const pick = e.target.closest('.wpick-btn');
    if (pick) {
      openWeaponMenu(pick);
      return;
    }
    if (e.target.closest('[data-add]')) {
      state.rows.push(rowFrom('', 9, transformForLevel(state.cls, state.level)));
      refresh();
      return;
    }
    const detail = e.target.closest('[data-detail]');
    if (detail) {
      state.selectedId = Number(detail.dataset.detail);
      state.popup = 'detail';
      refresh();
      return;
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      const id = Number(del.dataset.del);
      state.rows = state.rows.filter((r) => r.id !== id);
      if (state.selectedId === id) state.selectedId = null;
      refresh();
      return;
    }
    const tr = e.target.closest('tr[data-id]');
    if (!tr || e.target.closest('select, button')) return;
    state.selectedId = Number(tr.dataset.id);
    refresh();
  });
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.wpick')) closeWeaponMenus();
  });
  document.querySelector('.table-wrap').addEventListener('scroll', closeWeaponMenus);
  document.getElementById('weaponBody').addEventListener('change', (e) => {
    const tr = e.target.closest('tr[data-id]');
    if (!tr) return;
    const row = state.rows.find((r) => r.id === Number(tr.dataset.id));
    if (!row) return;
    if (e.target.classList.contains('enchant')) row.enchant = Number(e.target.value);
    state.selectedId = row.id;
    refresh();
  });
}

function mount() {
  const base = defaultBuffs();
  state.buffs = base.buffs;
  state.elfRanged = base.elfRanged;
  const restored = load();
  if (!restored) applyPreset(ELF_PRESET);
  writeControls();
  applyClassUi();
  bind();
  refresh();
}

mount();

  </script>
  <script src="count.js"></script>
  <script>LinCount.hit('tool', false);</script>
</body>
</html>
